<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #172a36;
      background: #f2f6f5;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
    }

    main {
      max-width: 28rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 3.5rem);
      line-height: 1;
    }

    #instructions {
      margin: .75rem 0 1.25rem;
      line-height: 1.5;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(9, minmax(0, 1fr));
      aspect-ratio: 1;
      border: 2px solid #172a36;
      background: #fff;
    }

    #board input {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-right: 1px solid #a8b9c0;
      border-bottom: 1px solid #a8b9c0;
      border-radius: 0;
      background: #fff;
      color: #065f55;
      font: 500 clamp(1rem, 5vw, 1.6rem) system-ui, sans-serif;
      text-align: center;
    }

    #board input:nth-child(3n) { border-right: 2px solid #172a36; }
    #board input:nth-child(9n) { border-right: 0; }
    #board input:nth-child(n+19):nth-child(-n+27),
    #board input:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #172a36; }
    #board input:nth-child(n+73) { border-bottom: 0; }

    #board input[readonly] {
      background: #e3ebee;
      color: #172a36;
      font-weight: 700;
    }

    #board input:focus {
      outline: 2px solid #08776b;
      outline-offset: -2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem;
      margin-top: 1rem;
    }

    button {
      padding: .6rem 1rem;
      border: 1px solid #065f55;
      border-radius: .5rem;
      background: #fff;
      color: #065f55;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #check {
      background: #065f55;
      color: #fff;
    }

    button:focus-visible {
      outline: 2px solid #065f55;
      outline-offset: 3px;
    }

    #status {
      min-height: 1.5em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Sudoku</h1>
    <p id="instructions">Fill the empty squares with digits 1 to 9, without repeating a digit in any row, column, or 3-by-3 box. Shaded starting numbers are locked.</p>
    <div id="board" role="group" aria-label="Sudoku board" aria-describedby="instructions"></div>
    <div class="actions">
      <button type="button" id="check">Check Solution</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <p id="status" role="status"></p>
    <noscript>Enable JavaScript to play Sudoku.</noscript>
  </main>

  <script>
    const puzzle = [
      '790003010', '160094002', '503010070',
      '000001020', '000865000', '070900000',
      '080050703', '600430089', '030600041'
    ].join('');
    const solution = [
      '792583614', '168794352', '543216978',
      '459371826', '321865497', '876942135',
      '284159763', '615437289', '937628541'
    ].join('');

    const board = document.getElementById('board');
    const status = document.getElementById('status');
    const cells = Array.from(puzzle, (digit, index) => {
      const cell = document.createElement('input');
      const row = Math.floor(index / 9) + 1;
      const column = index % 9 + 1;
      cell.type = 'text';
      cell.inputMode = 'numeric';
      cell.maxLength = 1;
      cell.autocomplete = 'off';
      cell.readOnly = digit !== '0';
      cell.setAttribute('aria-label', `Row ${row}, column ${column}${cell.readOnly ? ', given' : ''}`);
      if (cell.readOnly) {
        cell.value = digit;
        cell.tabIndex = -1;
      } else {
        cell.addEventListener('input', () => {
          cell.value = cell.value.match(/[1-9]/)?.[0] ?? '';
          status.textContent = '';
        });
      }
      board.append(cell);
      return cell;
    });

    document.getElementById('check').addEventListener('click', () => {
      const answer = cells.map(cell => cell.value).join('');
      if (answer.length < puzzle.length) {
        status.textContent = 'Incomplete: fill in every square before checking.';
      } else if (answer !== solution) {
        status.textContent = 'Incorrect: at least one number is out of place.';
      } else {
        status.textContent = 'Solved! You completed the puzzle.';
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (!window.confirm('Reset the puzzle and clear all your entries?')) return;

      for (const cell of cells) {
        if (!cell.readOnly) cell.value = '';
      }
      status.textContent = 'Puzzle reset.';
    });
  </script>
</body>
</html>
