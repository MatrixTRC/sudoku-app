<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #172a36;
      background: #f2f6f5;
    }

    body {
      margin: 0;
      padding: 2rem .25rem;
    }

    main {
      max-width: 28rem;
      margin: 0 auto;
    }

    .heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
    }

    #elapsed-time {
      margin: 0;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 3.5rem);
      line-height: 1;
    }

    #instructions {
      margin: .75rem 0 1.25rem;
      line-height: 1.5;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      grid-template-rows: repeat(9, minmax(0, 1fr));
      aspect-ratio: 1;
      border: 2px solid #172a36;
      background: #fff;
    }

    .cell {
      position: relative;
      min-width: 0;
      min-height: 0;
      border-right: 1px solid #657b83;
      border-bottom: 1px solid #657b83;
    }

    .cell:nth-child(3n) { border-right: 2px solid #172a36; }
    .cell:nth-child(9n) { border-right: 0; }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid #172a36; }
    .cell:nth-child(n+73) { border-bottom: 0; }

    #board input {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #fff;
      color: #065f55;
      font: 500 clamp(1rem, 5vw, 1.6rem) system-ui, sans-serif;
      text-align: center;
    }

    .notes {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      pointer-events: none;
      color: #065f55;
      font-size: clamp(.5625rem, 2.8vw, .8rem);
      line-height: 1;
      text-align: center;
    }

    .notes span {
      display: grid;
      place-items: center;
    }

    #board input[readonly] {
      background: #e3ebee;
      color: #172a36;
      font-weight: 700;
    }

    #board input.matching {
      background: #c6e8df;
    }

    #board input:focus {
      outline: 2px solid #08776b;
      outline-offset: -2px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem;
      margin-top: 1rem;
    }

    @media (max-width: 30rem) {
      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    button {
      min-width: 44px;
      min-height: 44px;
      padding: .6rem 1rem;
      border: 1px solid #065f55;
      border-radius: .5rem;
      background: #fff;
      color: #065f55;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    #check, #notes-toggle[aria-pressed="true"] {
      background: #065f55;
      color: #fff;
    }

    button:disabled {
      border-color: #657b83;
      background: #e3ebee;
      color: #52636b;
      cursor: not-allowed;
    }

    button:focus-visible {
      outline: 2px solid #065f55;
      outline-offset: 3px;
    }

    #status {
      min-height: 1.5em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <div class="heading">
      <h1>Sudoku</h1>
      <p id="elapsed-time">Time: <span id="timer" role="timer" aria-label="Elapsed time">00:00</span></p>
    </div>
    <p id="instructions">Fill the empty squares with digits 1 to 9, without repeating a digit in any row, column, or 3-by-3 box. Shaded starting numbers are locked. Turn on Notes to toggle possible digits in empty squares; turn it off to enter an answer.</p>
    <div id="board" role="group" aria-label="Sudoku board" aria-describedby="instructions"></div>
    <div class="actions">
      <button type="button" id="check">Check Solution</button>
      <button type="button" id="notes-toggle" aria-pressed="false">Notes: Off</button>
      <button type="button" id="undo" disabled>Undo</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <p id="status" role="status"></p>
    <noscript>Enable JavaScript to play Sudoku.</noscript>
  </main>

  <script>
    const puzzle = [
      '790003010', '160094002', '503010070',
      '000001020', '000865000', '070900000',
      '080050703', '600430089', '030600041'
    ].join('');
    const solution = [
      '792583614', '168794352', '543216978',
      '459371826', '321865497', '876942135',
      '284159763', '615437289', '937628541'
    ].join('');

    const board = document.getElementById('board');
    const status = document.getElementById('status');
    const notesToggle = document.getElementById('notes-toggle');
    const undoButton = document.getElementById('undo');
    const timer = document.getElementById('timer');
    let elapsedMilliseconds = 0;
    let timerStartedAt = null;
    let timerInterval = null;
    let timerHasStarted = false;
    let notesMode = false;
    const undoHistory = [];
    const cells = Array.from(puzzle, (digit, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'cell';
      const cell = document.createElement('input');
      const noteDisplay = document.createElement('div');
      noteDisplay.className = 'notes';
      noteDisplay.setAttribute('aria-hidden', 'true');
      for (let number = 1; number <= 9; number++) {
        noteDisplay.append(document.createElement('span'));
      }
      const row = Math.floor(index / 9) + 1;
      const column = index % 9 + 1;
      const entry = {
        input: cell,
        value: digit === '0' ? '' : digit,
        notes: new Set(),
        noteDisplay,
        label: `Row ${row}, column ${column}${digit !== '0' ? ', given' : ''}`
      };
      cell.type = 'text';
      cell.inputMode = 'numeric';
      cell.maxLength = 1;
      cell.autocomplete = 'off';
      cell.readOnly = digit !== '0';
      cell.setAttribute('aria-label', entry.label);
      const selectCell = () => highlightNumber(cell.value);
      cell.addEventListener('focus', selectCell);
      cell.addEventListener('click', selectCell);
      if (cell.readOnly) {
        cell.value = digit;
      } else {
        cell.addEventListener('input', () => {
          const previousValue = entry.value;
          const previousNotes = new Set(entry.notes);
          const number = cell.value.match(/[1-9]/)?.[0] ?? '';
          if (notesMode) {
            if (!entry.value && number) {
              if (entry.notes.has(number)) entry.notes.delete(number);
              else entry.notes.add(number);
            }
            cell.value = entry.value;
          } else {
            cell.value = number;
            entry.value = number;
            if (number) entry.notes.clear();
          }
          if (entry.value !== previousValue ||
              [...entry.notes].sort().join(',') !== [...previousNotes].sort().join(',')) {
            undoHistory.push({
              type: 'cell',
              entry,
              value: previousValue,
              notes: previousNotes
            });
            updateUndoState();
            startTimer();
          }
          renderNotes(entry);
          highlightNumber(cell.value);
          status.textContent = '';
        });
      }
      wrapper.append(cell, noteDisplay);
      board.append(wrapper);
      return entry;
    });

    function getElapsedTime() {
      return elapsedMilliseconds + (timerStartedAt === null ? 0 : performance.now() - timerStartedAt);
    }

    function renderTimer() {
      const seconds = Math.floor(getElapsedTime() / 1000);
      const minutes = Math.floor(seconds / 60);
      timer.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerStartedAt !== null) return;
      timerHasStarted = true;
      timerStartedAt = performance.now();
      timerInterval = window.setInterval(renderTimer, 250);
      renderTimer();
    }

    function stopTimer() {
      elapsedMilliseconds = getElapsedTime();
      timerStartedAt = null;
      window.clearInterval(timerInterval);
      timerInterval = null;
      renderTimer();
    }

    function restoreTimer(snapshot) {
      stopTimer();
      elapsedMilliseconds = snapshot.elapsed;
      timerHasStarted = snapshot.started;
      if (timerHasStarted) startTimer();
      else renderTimer();
    }

    function highlightNumber(number) {
      for (const entry of cells) {
        entry.input.classList.toggle('matching', number !== '' && entry.input.value === number);
      }
    }

    function renderNotes(entry) {
      Array.from(entry.noteDisplay.children).forEach((slot, index) => {
        const number = String(index + 1);
        slot.textContent = entry.notes.has(number) ? number : '';
      });
      const candidates = Array.from(entry.notes).sort().join(', ');
      entry.input.setAttribute('aria-label', `${entry.label}${candidates ? `, notes: ${candidates}` : ''}`);
    }

    function updateUndoState() {
      undoButton.disabled = undoHistory.length === 0;
    }

    undoButton.addEventListener('click', () => {
      const edit = undoHistory.pop();
      if (!edit) return;

      if (edit.type === 'board') {
        for (const snapshot of edit.cells) {
          const entry = snapshot.entry;
          entry.value = snapshot.value;
          entry.input.value = snapshot.value;
          entry.notes = new Set(snapshot.notes);
          renderNotes(entry);
        }
        restoreTimer(edit.timer);
        highlightNumber(document.activeElement?.value ?? '');
      } else {
        edit.entry.value = edit.value;
        edit.entry.input.value = edit.value;
        edit.entry.notes = new Set(edit.notes);
        renderNotes(edit.entry);
        highlightNumber(edit.entry.input.value);
        startTimer();
      }

      updateUndoState();
      status.textContent = 'Edit undone.';
    });

    notesToggle.addEventListener('click', () => {
      notesMode = !notesMode;
      notesToggle.setAttribute('aria-pressed', String(notesMode));
      notesToggle.textContent = `Notes: ${notesMode ? 'On' : 'Off'}`;
    });

    document.getElementById('check').addEventListener('click', () => {
      const answer = cells.map(entry => entry.input.value).join('');
      if (answer.length < puzzle.length) {
        status.textContent = 'Incomplete: fill in every square before checking.';
      } else if (answer !== solution) {
        status.textContent = 'Incorrect: at least one number is out of place.';
      } else {
        stopTimer();
        status.textContent = 'Solved! You completed the puzzle.';
      }
    });

    document.getElementById('reset').addEventListener('click', () => {
      if (!window.confirm('Reset the puzzle and clear all your entries and notes?')) return;

      const previousTimer = { elapsed: getElapsedTime(), started: timerHasStarted };
      const snapshots = [];
      for (const entry of cells) {
        if (entry.input.readOnly) continue;
        snapshots.push({
          entry,
          value: entry.value,
          notes: new Set(entry.notes)
        });
        entry.input.value = '';
        entry.value = '';
        entry.notes.clear();
        renderNotes(entry);
      }
      if (snapshots.length > 0) {
        undoHistory.push({ type: 'board', cells: snapshots, timer: previousTimer });
        updateUndoState();
      }
      restoreTimer({ elapsed: 0, started: false });
      highlightNumber('');
      status.textContent = 'Puzzle reset.';
    });
  </script>
</body>
</html>
